[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-alertas-climaticas"
version = "0.1.0"
description = "Sistema de alertas agroclimaticas para Santiago."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "groq>=0.4.0",
  "matplotlib>=3.8.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

